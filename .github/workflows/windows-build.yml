name: Windows portable build
on:
  push:
    branches: [main]
    paths: ['windows-port/**', '.github/workflows/windows-build.yml', '.gitmodules']
  pull_request:
    paths: ['windows-port/**', '.github/workflows/windows-build.yml', '.gitmodules']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build Microsoft Detours 4.0.1
        shell: pwsh
        run: |
          git clone --depth 1 --branch v4.0.1 https://github.com/microsoft/Detours.git "$env:RUNNER_TEMP\detours"
          if ($LASTEXITCODE) { throw 'Detours checkout failed' }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $env:DETOURS_TARGET_PROCESSOR = 'X64'
          & $env:ComSpec /d /s /c "call `"$vcvars`" >nul && cd /d `"$env:RUNNER_TEMP\detours\src`" && nmake /nologo"
          if ($LASTEXITCODE) { throw 'Detours compilation failed' }
      - name: Build and package from repository root
        shell: pwsh
        run: ./windows-port/build.ps1 -DetoursRoot "$env:RUNNER_TEMP\detours" -StaticRuntime -Package
      - name: Check packaged launcher without a GPU
        shell: pwsh
        run: |
          $zip = 'windows-port/tools/outputs/GreenBoost-Windows-2.4.0-beta.3-x64.zip'
          $folder = Join-Path $env:RUNNER_TEMP 'greenboost-smoke'
          Expand-Archive -LiteralPath $zip -DestinationPath $folder
          & "$folder/greenboost.exe" --help
          if ($LASTEXITCODE) { throw 'Launcher help failed' }
          & "$folder/greenboost.exe" "$folder/does-not-exist.exe"
          if ($LASTEXITCODE -eq 0) { throw 'Missing application incorrectly succeeded' }
          foreach ($name in @('install_llama.ps1','run_llama.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile("$folder/$name", [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw "$name has parse errors: $errors" }
          }
          $refused = $false
          try { & "$folder/install_llama.ps1" -Destination $folder }
          catch {
            if ($_.Exception.Message -notlike 'Destination already exists:*') { throw }
            $refused = $true
          }
          if (!$refused -or !(Test-Path "$folder/greenboost.exe")) { throw 'Installer failed to preserve an existing installation' }
          # PowerShell 5.1 -File must resolve defaults in the script body. This
          # runner has no installed backend, so the expected error names its path.
          $pathError = Join-Path $env:RUNNER_TEMP 'llama-default-path.txt'
          & powershell.exe -NoProfile -File "$folder/run_llama.ps1" -ListDevices 2> $pathError
          if ($LASTEXITCODE -eq 0) { throw 'Missing backend incorrectly succeeded' }
          if ((Get-Content $pathError -Raw) -notmatch 'backends.*llama-b12019-cuda13.4') {
            throw 'PowerShell 5.1 did not resolve the default backend path'
          }
          exit 0
